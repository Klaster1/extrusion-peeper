<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Extrusion Peeper</title>
    <link rel="stylesheet" href="/vendor/dseg/css/dseg.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>"
    />
  </head>
  <body>
    <script type="module" src="/client/page.js"></script>

    <video
      id="video"
      muted
      autoplay
      playsinline
      disablepictureinpicture
    ></video>
    <div class="status">Connecting to camera…</div>

    <button
      title="Settings"
      id="button-settings"
      class="round-button"
      type="button"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
        />
      </svg>
    </button>

    <dialog id="dialog-settings">
      <form action="/api/settings" method="post">
        <header>
          <h1>Settings</h1>
          <button type="button" class="close" title="Close" data-close>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div class="tabs" role="tablist" aria-label="Settings">
          <button
            type="button"
            role="tab"
            id="tab-sensors"
            aria-controls="panel-sensors"
            aria-selected="true"
          >
            Sensors
          </button>
          <button
            type="button"
            role="tab"
            id="tab-camera"
            aria-controls="panel-camera"
            aria-selected="false"
            tabindex="-1"
          >
            Camera
          </button>
        </div>
        <div class="content">
          <div id="panel-sensors" role="tabpanel" aria-labelledby="tab-sensors">
            <div id="sensor-list"></div>
            <button type="button" id="button-add-sensor" class="add">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
              Add sensor
            </button>
          </div>
          <div
            id="panel-camera"
            role="tabpanel"
            aria-labelledby="tab-camera"
            hidden
          >
            <section>
              <h2>Connection</h2>
              <label class="row">
                <span>Host</span>
                <input
                  type="text"
                  name="cameraHost"
                  placeholder="192.168.1.15"
                />
              </label>
              <label class="row">
                <span>Login</span>
                <input type="text" name="cameraLogin" placeholder="admin" />
              </label>
              <label class="row">
                <span>Password</span>
                <input
                  type="password"
                  name="cameraPassword"
                  placeholder="password"
                  autocomplete="current-password"
                />
              </label>
            </section>
            <section>
              <h2>Display</h2>
              <label class="row">
                <span>Video size</span>
                <select name="cameraFit">
                  <option value="fit">Fit: show the whole picture</option>
                  <option value="fill">Fill: crop to the page</option>
                  <option value="stretch">Stretch: distort to the page</option>
                </select>
              </label>
            </section>
          </div>
        </div>
        <footer>
          <button type="submit" class="primary">Save</button>
          <button type="button" data-close>Cancel</button>
        </footer>
      </form>
    </dialog>

    <template id="template-sensor">
      <div class="sensor">
        <div class="sensor-header">
          <button
            type="button"
            class="drag-handle"
            title="Drag to reorder"
            aria-label="Reorder sensor with arrow keys"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"
              />
            </svg>
          </button>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
          <span class="title"></span>
          <button type="button" class="close" title="Remove sensor" data-remove>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <label class="row">
          <span>Sensor</span>
          <select name="sensorDeviceId" required></select>
        </label>
        <label class="row">
          <span>Shows</span>
          <select name="sensorDisplay"></select>
        </label>
        <label class="row">
          <span>Label</span>
          <input type="text" name="sensorLabel" placeholder="Sensor name" />
        </label>
        <label class="row">
          <span>Icon</span>
          <select name="sensorIcon" class="icon-select">
            <button><selectedcontent></selectedcontent></button>
          </select>
        </label>
      </div>
    </template>

    <div class="readouts"></div>
    <template id="template-readout">
      <div class="readout">
        <span class="caption">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
          <span class="label"></span>
        </span>
        <span class="digits">
          <span class="background"></span>
          <span class="value"></span>
        </span>
      </div>
    </template>
    <div class="temperature-notification">
      <label>Notify at</label>
      <input
        type="number"
        min="30"
        max="60"
        placeholder="Temperature"
        value="40"
      />
      <input type="checkbox" />
    </div>
    <style>
      /* Colors and metrics of Orca Slicer's dark theme */
      :root {
        color-scheme: dark;
        --canvas: #242428;
        --panel: #2d2d31;
        --panel-raised: #36363c;
        --control: #3e3e45;
        --control-hover: #4a4a52;
        --border: #4c4c55;
        --text: #efeff0;
        --text-muted: #a3a3a8;
        --text-disabled: #6b6b70;
        --accent: #009688;
        --accent-hover: #26a69a;
        --radius: 4px;
      }
      body {
        margin: 0;
        padding: 0;
        background: var(--canvas);
        color: var(--text);
        max-width: 100vw;
        max-height: 100vh;
        overflow: hidden;
        font:
          13px "HarmonyOS Sans SC",
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      video {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: contain;
      }
      .status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--text-muted);
        font-size: 14px;
        pointer-events: none;
      }
      .playing .status {
        display: none;
      }

      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--control);
        border: 1px solid transparent;
        border-radius: var(--radius);
        padding: 5px 20px;
        cursor: pointer;
      }
      button:hover {
        background: var(--control-hover);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: none;
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      .round-button {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 2;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 50%;
        background: color-mix(in srgb, var(--panel-raised) 85%, transparent);
        color: var(--text-muted);
      }
      .round-button:hover {
        color: var(--text);
      }

      dialog {
        width: min(440px, calc(100vw - 32px));
        padding: 0;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.5);
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.4);
      }
      dialog header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 6px 6px 12px;
      }
      dialog h1 {
        margin: 0;
        font-size: 13px;
        font-weight: normal;
      }
      dialog .close {
        display: grid;
        place-items: center;
        padding: 4px;
        background: none;
        color: var(--text-muted);
      }
      dialog .close:hover {
        color: var(--text);
        background: var(--control);
      }
      /* Orca underlines the selected tab in its accent color */
      .tabs {
        display: flex;
        gap: 4px;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);

        [role="tab"] {
          margin-bottom: -1px;
          padding: 6px 10px;
          color: var(--text-muted);
          background: none;
          border: none;
          border-bottom: 2px solid transparent;
          border-radius: 0;
        }
        [role="tab"]:hover {
          color: var(--text);
          background: none;
        }
        [role="tab"][aria-selected="true"] {
          color: var(--text);
          border-bottom-color: var(--accent);
        }
        [role="tab"]:focus-visible {
          outline: 1px solid var(--accent);
        }
      }
      dialog .content {
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding: 12px 16px;
      }
      dialog section + section {
        margin-top: 12px;
      }
      /* Section headings are followed by a rule, like Orca's "Settings" and "Project" */
      dialog h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }
      dialog h2::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--border);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 220px;
        align-items: center;
        gap: 12px;
        padding: 4px 10px;
      }
      .row span {
        color: var(--text-muted);
      }
      input,
      select {
        box-sizing: border-box;
        width: 100%;
        height: 26px;
        padding: 2px 8px;
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 2px;
      }
      input:hover,
      select:hover {
        border-color: var(--accent);
      }
      input::placeholder {
        color: var(--text-disabled);
      }
      /* Orca puts the dropdown chevron on the left */
      select {
        appearance: none;
        padding-left: 24px;
        background: var(--panel)
          url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 4.5 6 8l3.5-3.5' fill='none' stroke='%23a3a3a8' stroke-width='1.2'/></svg>")
          no-repeat 6px center / 12px;
        cursor: pointer;
      }
      /* Shows the icons in the options where the browser can, and names elsewhere */
      .icon-select,
      .icon-select::picker(select) {
        appearance: base-select;
      }
      .icon-select {
        > button {
          display: contents;
        }
        &::picker-icon,
        option::checkmark {
          display: none;
        }
        &::picker(select) {
          margin-top: 2px;
          padding: 2px 0;
          color: var(--text);
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 2px;
          box-shadow: 0 4px 12px rgb(0 0 0 / 0.4);
        }
        selectedcontent,
        option {
          display: flex;
          align-items: center;
          gap: 6px;
        }
        option {
          padding: 4px 8px;
        }
        option:hover,
        option:focus-visible {
          outline: none;
          background: var(--control-hover);
        }
        option:checked {
          color: var(--accent-hover);
        }
        /* "None" keeps an empty slot, so the names line up */
        svg {
          display: block !important;
          flex: none;
          width: 16px;
          height: 16px;
        }
      }
      .sensor {
        margin-bottom: 8px;
        padding: 2px 0 4px;
        background: var(--panel-raised);
        border-radius: var(--radius);
      }
      .sensor.dragging {
        opacity: 0.5;
      }
      .drag-handle {
        display: grid;
        place-items: center;
        padding: 4px 2px;
        color: var(--text-disabled);
        background: none;
        cursor: grab;

        svg {
          stroke-width: 3;
        }
        &:hover {
          color: var(--text);
          background: none;
        }
      }
      .sensor-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 4px 2px 2px;

        .icon {
          color: var(--text-muted);
        }
        .title {
          flex: 1;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-weight: 600;
        }
      }
      button.add {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px 4px 8px;
      }
      dialog footer {
        display: flex;
        flex-direction: row-reverse;
        gap: 8px;
        padding: 10px 16px;
        border-top: 1px solid var(--border);
      }

      .temperature-notification {
        display: none;

        position: absolute;
        right: 250px;
        bottom: 25px;
        background: grey;
        padding: 10px;
        color: white;

        input[type="number"] {
          width: 80px;
        }
      }
      .readouts {
        position: absolute;
        right: 16px;
        bottom: 16px;
        display: flex;
        gap: 8px;
      }
      .readout {
        display: grid;
        gap: 2px;
        padding: 8px 14px 10px;
        background: color-mix(in srgb, var(--panel) 90%, transparent);
        border: 1px solid var(--border);
        border-radius: var(--radius);

        .caption {
          display: flex;
          align-items: center;
          gap: 4px;
          color: var(--text-muted);
          font-weight: 600;
        }
        .icon {
          width: 16px;
          height: 16px;
        }
        .digits {
          display: grid;
          font-size: 40px;
          /* DSEG7 has no "%", so it comes from the 14-segment font */
          font-family: "DSEG7-Classic", "DSEG14-Classic";
          font-style: oblique;
        }
        .value {
          color: var(--text);
        }
        &.stale .value {
          color: var(--text-disabled);
        }
        .background {
          color: color-mix(in srgb, var(--text) 8%, transparent);
        }
        .value,
        .background {
          grid-row: 1;
          grid-column: 1;
          text-align: right;
        }
      }
    </style>
  </body>
</html>
